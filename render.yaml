services:
  - type: web
    name: car-rental
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev && cd ../frontend && npm ci && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: SEED_ON_START
        value: "true"
